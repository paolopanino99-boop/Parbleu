<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="Ven 14 Set 2026">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La carta dei vini di Parbleu cafè</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=Special+Elite&family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Courier Prime', monospace;
            background-color: #0b2d24; /* Verde foresta scuro della palette */
            background-image: 
                linear-gradient(30deg, #184e3e 12%, transparent 12.5%, transparent 87%, #184e3e 87.5%, #184e3e),
                linear-gradient(150deg, #184e3e 12%, transparent 12.5%, transparent 87%, #184e3e 87.5%, #184e3e),
                linear-gradient(30deg, #184e3e 12%, transparent 12.5%, transparent 87%, #184e3e 87.5%, #184e3e),
                linear-gradient(150deg, #184e3e 12%, transparent 12.5%, transparent 87%, #184e3e 87.5%, #184e3e),
                linear-gradient(60deg, #94a399 25%, transparent 25.5%, transparent 75%, #94a399 75%, #94a399);
            background-size: 80px 140px;
            background-position: 0 0, 0 0, 40px 70px, 40px 70px, 0 0;
            color: #111111;
            overflow-x: hidden;
            min-height: 100vh;
        }
        .font-parbleu-title {
            font-family: 'Special Elite', cursive, monospace;
        }
        .font-parbleu-hand {
            font-family: 'Caveat', cursive;
        }
        .ink-border {
            border: 2px solid #111111;
            box-shadow: 4px 4px 0px #111111;
        }
        .ink-border-sm {
            border: 2px solid #111111;
            box-shadow: 2px 2px 0px #111111;
        }
    </style>
</head>
<body class="p-4 md:p-8 max-w-4xl mx-auto">

    <header class="text-center my-6 border-b-2 border-emerald-900/60 pb-6">
        <div class="inline-block bg-[#d2691e] text-white px-6 py-3 mb-4 transform -rotate-1 shadow-[5px_5px_0px_#111] border-2 border-black">
            <h1 class="font-parbleu-title text-4xl md:text-5xl tracking-widest uppercase font-bold text-white">PARBLEU</h1>
            <span class="font-parbleu-hand text-3xl md:text-4xl text-[#d1d5db] lowercase tracking-wider block -mt-2">cafè</span>
        </div>
        
        <div class="flex justify-center mt-2">
            <div class="inline-flex bg-white p-1 rounded-none border-2 border-black shadow-[3px_3px_0px_#111]">
                <button onclick="switchView('carta')" id="tab-carta" class="px-5 py-2 text-xs font-bold uppercase tracking-wider transition cursor-pointer bg-black text-white">
                    🍷 Carta dei Vini
                </button>
                <button onclick="switchView('mescita')" id="tab-mescita" class="px-5 py-2 text-xs font-bold uppercase tracking-wider transition cursor-pointer text-black hover:bg-black/10">
                    🥂 Oggi in mescita
                </button>
            </div>
        </div>

        <div class="flex justify-center items-center mt-3">
            <a href="https://www.instagram.com/viticolturaerotica/" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-1.5 text-xs text-[#facc15] hover:text-white font-bold tracking-wide transition active:scale-95 drop-shadow-sm">
                <span>powered by viticolturaerotica</span>
                <img src="https://i.ibb.co/XrYGdthZ/icona.png" alt="Viticoltura Erotica" class="w-5 h-5 object-contain rounded-full border border-black bg-white">
            </a>
        </div>
        
        <div id="status-loading" class="text-xs text-[#d1d5db] mt-2 font-bold hidden"></div>
    </header>

    <section class="mb-8 space-y-4">
        <div class="grid grid-cols-4 sm:flex sm:flex-wrap items-center justify-center gap-2 py-1">
            <button onclick="filterType('Tutti', this)" class="cat-btn col-span-2 sm:col-span-auto px-3 py-2 bg-black text-white text-[11px] font-bold uppercase tracking-wider ink-border-sm cursor-pointer">Tutti</button>
            <button onclick="filterType('rosso', this)" class="cat-btn col-span-2 sm:col-span-auto px-3 py-2 bg-white text-black hover:bg-black hover:text-white text-[11px] font-bold uppercase tracking-wider transition ink-border-sm cursor-pointer">Rossi</button>
            <button onclick="filterType('bianco', this)" class="cat-btn col-span-2 sm:col-span-auto px-3 py-2 bg-white text-black hover:bg-black hover:text-white text-[11px] font-bold uppercase tracking-wider transition ink-border-sm cursor-pointer">Bianchi</button>
            <button onclick="filterType('arancione', this)" class="cat-btn col-span-2 sm:col-span-auto px-3 py-2 bg-white text-black hover:bg-black hover:text-white text-[11px] font-bold uppercase tracking-wider transition ink-border-sm cursor-pointer">Arancione</button>
            <button onclick="filterType('rosa', this)" class="cat-btn col-span-2 sm:col-span-auto px-3 py-2 bg-white text-black hover:bg-black hover:text-white text-[11px] font-bold uppercase tracking-wider transition ink-border-sm cursor-pointer">Rosa</button>
            <button onclick="filterType('franciacorta', this)" class="cat-btn col-span-2 sm:col-span-auto px-3 py-2 bg-white text-black hover:bg-black hover:text-white text-[11px] font-bold uppercase tracking-wider transition ink-border-sm cursor-pointer">Franciacorta</button>
            <button onclick="filterType('altre bolle', this)" class="cat-btn col-span-2 sm:col-span-auto px-3 py-2 bg-white text-black hover:bg-black hover:text-white text-[11px] font-bold uppercase tracking-wider transition ink-border-sm cursor-pointer">Altre Bolle</button>
            <button onclick="filterType('champagne', this)" class="cat-btn col-span-2 sm:col-span-auto px-3 py-2 bg-white text-black hover:bg-black hover:text-white text-[11px] font-bold uppercase tracking-wider transition ink-border-sm cursor-pointer">Champagne</button>
        </div>

        <div class="relative pt-1">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 pt-1 pointer-events-none text-black text-sm z-10">🔍</span>
            <input type="text" id="search-input" oninput="handleSearch()" placeholder="Cerca per vino, cantina, vitigno, zona..." class="w-full pl-10 pr-4 py-2.5 bg-white border-2 border-black text-xs font-semibold text-black placeholder-stone-500 focus:outline-none focus:bg-stone-50 transition shadow-[3px_3px_0px_#111]">
        </div>

        <div class="flex flex-col sm:flex-row gap-3 pt-1 border-t-2 border-emerald-900/30">
            <div class="flex gap-2 flex-1">
                <button onclick="filterPrice('ECONOMY')" id="btn-economy" class="price-btn flex-1 py-2.5 bg-white text-black border-2 border-black text-xs font-bold tracking-widest transition active:scale-95 shadow-[2px_2px_0px_#111] cursor-pointer">
                    💰 ECONOMY <span class="block text-[10px] font-semibold tracking-normal text-stone-700">Fino a 30€</span>
                </button>
                <button onclick="filterPrice('BUSINESS')" id="btn-business" class="price-btn flex-1 py-2.5 bg-white text-black border-2 border-black text-xs font-bold tracking-widest transition active:scale-95 shadow-[2px_2px_0px_#111] cursor-pointer">
                    💼 BUSINESS <span class="block text-[10px] font-semibold tracking-normal text-stone-700">31€ - 50€</span>
                </button>
                <button onclick="filterPrice('POWER')" id="btn-power" class="price-btn flex-1 py-2.5 bg-white text-black border-2 border-black text-xs font-bold tracking-widest transition active:scale-95 shadow-[2px_2px_0px_#111] cursor-pointer">
                    ⚡ POWER <span class="block text-[10px] font-semibold tracking-normal text-stone-700">Sopra 50€</span>
                </button>
            </div>
            <button onclick="suggestRandomWine()" class="w-full sm:w-auto px-6 py-2.5 bg-[#d2691e] hover:bg-[#b85b19] text-white border-2 border-black text-xs font-black tracking-wider transition active:scale-95 shadow-[3px_3px_0px_#111] uppercase cursor-pointer">
                MA CHE NE SO. FAI TU.
            </button>
        </div>
    </section>

    <main id="wine-list" class="grid grid-cols-1 md:grid-cols-2 gap-6">
    </main>

    <div id="wine-modal" class="fixed inset-0 bg-black/80 backdrop-blur-xs hidden z-50 items-center justify-center p-4" onclick="closeModal()">
        <div class="bg-white text-black p-6 md:p-8 max-w-lg w-full border-2 border-black shadow-[6px_6px_0px_#111] relative" onclick="event.stopPropagation()">
            <button onclick="closeModal()" class="absolute top-4 right-4 text-black hover:text-stone-600 text-2xl font-bold">&times;</button>
            <div id="modal-badge-container" class="flex flex-wrap gap-1"></div>
            
            <h3 id="modal-wine-cantina" class="font-parbleu-title text-3xl text-black mt-3 font-medium leading-tight"></h3>
            <p id="modal-wine-name" class="text-stone-800 text-base mt-1 font-semibold"></p>
            <p id="modal-wine-uve" class="text-stone-700 text-xs mt-1.5 font-medium flex items-center gap-1"></p>
            
            <div class="border-t-2 border-black my-4 pt-4 space-y-2 text-sm text-stone-800">
                <p id="modal-wine-geo"></p>
                <div class="flex justify-between items-center pt-1">
                    <span id="modal-price-label" class="text-stone-700 text-xs uppercase tracking-wider font-bold">Prezzo Bottiglia</span>
                    <p id="modal-wine-price" class="text-black font-bold text-lg"></p>
                </div>
            </div>
            <div id="modal-desc-box" class="bg-emerald-50 p-4 border-2 border-black mt-4 hidden shadow-[3px_3px_0px_#111]">
                <h4 class="text-xs uppercase tracking-wider text-black font-bold mb-2 font-mono">Nota di Degustazione</h4>
                <p id="modal-wine-desc" class="font-parbleu-hand text-xl text-stone-900 leading-relaxed"></p>
            </div>
        </div>
    </div>

    <script>
        const GOOGLE_SHEET_URL = "https://docs.google.com/spreadsheets/d/17O5LVhc-iiQSwvMl7iWxgENIxnfaUJx1sJrTTyzRYTE/edit?hl=it&gid=0#gid=0";
        let wines = [];
        let currentView = 'carta';
        let currentFilter = 'Tutti';
        let currentPriceFilter = 'Tutti'; 
        let searchQuery = '';
        let isLoaded = false;

        function shuffleWines(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex != 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        function parsePrice(val) {
            if (val === undefined || val === null || val === '') return 0;
            if (typeof val === 'number') return val;
            let str = String(val).replace(',', '.').replace(/[^0-9.-]+/g, "");
            let num = parseFloat(str);
            return isNaN(num) ? 0 : num;
        }

        window.googleDocCallback = function(data) {
            isLoaded = true;
            const statusEl = document.getElementById('status-loading');
            try {
                if (!data || !data.table || !data.table.rows) {
                    statusEl.innerText = "🔴 Il foglio Google risponde ma sembra vuoto.";
                    statusEl.classList.remove('hidden');
                    return;
                }
                const rows = data.table.rows;
                const cols = data.table.cols.map(c => c.label ? c.label.toLowerCase().trim() : '');
                if (!cols.includes('nome')) {
                    statusEl.innerHTML = "⚠️ <b>Errore Intestazioni:</b> Manca la colonna 'nome' nel foglio.";
                    statusEl.classList.remove('hidden');
                    return;
                }

                const validRows = rows.filter(row => row && row.c && row.c[cols.indexOf('nome')] && row.c[cols.indexOf('nome')].v);
                wines = shuffleWines(validRows.map(row => {
                    const obj = {};
                    row.c.forEach((cell, i) => { if (cols[i]) obj[cols[i]] = cell ? cell.v : ''; });
                    
                    const checkBool = (val) => val !== undefined && val !== null && String(val).toUpperCase().trim() === 'TRUE';
                    const prezzoBicchiereVal = parsePrice(obj.bicchiere);

                    return {
                        cantina: obj.cantina ? String(obj.cantina).trim() : '',
                        nome: obj.nome ? String(obj.nome).trim() : '',
                        tipo: obj.tipo ? String(obj.tipo).toLowerCase().trim() : '',
                        regione: obj.regione ? String(obj.regione).trim() : '',
                        zona: obj.zona ? String(obj.zona).trim() : '',
                        uve: obj.uve ? String(obj.uve).trim() : '',
                        anno: obj.anno ? parseInt(obj.anno) : '',
                        prezzo: parsePrice(obj.prezzo),
                        prezzoBicchiere: prezzoBicchiereVal,
                        disponibile: obj.disponibile !== undefined ? checkBool(obj.disponibile) : true,
                        doc: obj.doc ? String(obj.doc).trim() : '',
                        descrizione: obj.descrizione ? String(obj.descrizione).trim() : '',
                        sottotipo: obj.sottotipo ? String(obj.sottotipo).trim() : '',
                    };
                }));

                statusEl.classList.add('hidden');
                renderWines();
            } catch (error) {
                console.error(error);
                statusEl.innerText = "🔴 Errore durante l'elaborazione del menu.";
                statusEl.classList.add('hidden');
            }
        };

        function loadDataViaJSONP() {
            const statusEl = document.getElementById('status-loading');
            const matches = GOOGLE_SHEET_URL.match(/\/d\/([^/]+)/);
            if (!matches || !matches[1]) { 
                statusEl.innerText = "🔴 Errore: Link del foglio non valido."; 
                statusEl.classList.remove('hidden');
                return; 
            }
            
            const script = document.createElement('script');
            script.src = `https://docs.google.com/spreadsheets/d/${matches[1]}/gviz/tq?tqx=responseHandler:googleDocCallback&t=${Date.now()}`;
            script.onerror = function() { 
                statusEl.innerText = "🔴 Impossibile connettersi a Google Fogli."; 
                statusEl.classList.add('hidden');
            };
            document.body.appendChild(script);
        }

        function switchView(view) {
            currentView = view;
            const tabCarta = document.getElementById('tab-carta');
            const tabMescita = document.getElementById('tab-mescita');

            const activeTabClass = "px-5 py-2 text-xs font-bold uppercase tracking-wider transition cursor-pointer bg-black text-white";
            const inactiveTabClass = "px-5 py-2 text-xs font-bold uppercase tracking-wider transition cursor-pointer text-black hover:bg-black/10";

            if (view === 'carta') {
                tabCarta.className = activeTabClass;
                tabMescita.className = inactiveTabClass;
            } else {
                tabMescita.className = activeTabClass;
                tabCarta.className = inactiveTabClass;
            }
            renderWines();
        }

        function filterType(type, element) {
            currentFilter = type;
            updateButtonStyles(type, element);
            renderWines();
        }

        function updateButtonStyles(activeType, element) {
            document.querySelectorAll('.cat-btn').forEach(btn => {
                btn.className = "cat-btn col-span-2 sm:col-span-auto px-3 py-2 bg-white text-black hover:bg-black hover:text-white text-[11px] font-bold uppercase tracking-wider transition ink-border-sm cursor-pointer";
            });

            if (element) {
                element.className = "cat-btn col-span-2 sm:col-span-auto px-3 py-2 bg-black text-white text-[11px] font-bold uppercase tracking-wider ink-border-sm cursor-pointer";
            }
        }

        function filterPrice(mode) {
            const btnEconomy = document.getElementById('btn-economy');
            const btnBusiness = document.getElementById('btn-business');
            const btnPower = document.getElementById('btn-power');

            const defaultClass = "price-btn flex-1 py-2.5 bg-white text-black border-2 border-black text-xs font-bold tracking-widest transition active:scale-95 shadow-[2px_2px_0px_#111] cursor-pointer";
            btnEconomy.className = defaultClass;
            btnBusiness.className = defaultClass;
            btnPower.className = defaultClass;

            if (currentPriceFilter === mode) {
                currentPriceFilter = 'Tutti';
            } else {
                currentPriceFilter = mode;
                const activeBtn = mode === 'ECONOMY' ? btnEconomy : (mode === 'BUSINESS' ? btnBusiness : btnPower);
                activeBtn.className = "price-btn flex-1 py-2.5 bg-black text-white border-2 border-black text-xs font-bold tracking-widest transition active:scale-95 shadow-[2px_2px_0px_#111] cursor-pointer";
            }
            renderWines();
        }

        function handleSearch() {
            const input = document.getElementById('search-input');
            searchQuery = input.value.toLowerCase().trim();
            renderWines();
        }

        function suggestRandomWine() {
            if (wines.length === 0) return;
            
            const eligibleWines = wines.filter(w => {
                if (!w.disponibile) return false;
                if (currentView === 'mescita' && w.prezzoBicchiere <= 0) return false;

                let matchesFilter = false;
                const activeFilterLower = currentFilter.toLowerCase().trim();
                const wineTipoLower = w.tipo ? w.tipo.toLowerCase().trim() : '';
                
                if (activeFilterLower === 'tutti') { 
                    matchesFilter = true; 
                } else if (activeFilterLower === 'champagne') {
                    matchesFilter = w.champagne === true || wineTipoLower === 'champagne';
                } else { 
                    matchesFilter = wineTipoLower === activeFilterLower; 
                }

                let targetPrice = currentView === 'mescita' ? w.prezzoBicchiere : w.prezzo;
                let matchesPrice = true;
                if (currentPriceFilter === 'ECONOMY') matchesPrice = targetPrice <= 30;
                if (currentPriceFilter === 'BUSINESS') matchesPrice = targetPrice >= 31 && targetPrice <= 50;
                if (currentPriceFilter === 'POWER') matchesPrice = targetPrice > 50;

                let matchesSearch = true;
                if (searchQuery) {
                    const fullText = `${w.cantina} ${w.nome} ${w.uve} ${w.regione} ${w.zona} ${w.doc} ${w.anno}`.toLowerCase();
                    matchesSearch = fullText.includes(searchQuery);
                }

                return matchesFilter && matchesPrice && matchesSearch;
            });

            if (eligibleWines.length === 0) {
                alert("Nessun vino disponibile corrisponde ai filtri e alla ricerca attualmente selezionati.");
                return;
            }

            const randomIndex = Math.floor(Math.random() * eligibleWines.length);
            const selectedWine = eligibleWines[randomIndex];
            
            const globalIndex = wines.findIndex(w => w.nome === selectedWine.nome && w.cantina === selectedWine.cantina && w.anno === selectedWine.anno);
            if (globalIndex !== -1) { openModal(globalIndex); }
        }

        function openModal(index) {
            const w = wines[index];
            if (!w) return;
            const docBadge = w.doc ? `<span class="text-[10px] font-mono font-bold tracking-wider bg-white text-black px-1.5 py-0.5 rounded-none border border-black ml-2 uppercase">${w.doc}</span>` : '';
            let labels = [];
            if (w.sottotipo) labels.push(w.sottotipo);
            if (currentView === 'mescita' || w.prezzoBicchiere > 0) labels.push('In Mescita');
            
            const badgesHtml = labels.map(l => `<span class="text-[9px] font-bold px-2 py-0.5 rounded-none uppercase tracking-wider bg-black text-white border border-black">${l}</span>`).join('') + docBadge;
            
            document.getElementById('modal-badge-container').innerHTML = badgesHtml;
            document.getElementById('modal-wine-cantina').innerText = w.cantina;
            document.getElementById('modal-wine-name').innerHTML = `${w.nome} <span class="text-sm font-mono text-stone-600 ml-1 font-normal">${w.anno || ''}</span>`;
            document.getElementById('modal-wine-uve').innerHTML = `🍇 Uve: <span class="text-black font-semibold">${w.uve || 'N/D'}</span>`;
            document.getElementById('modal-wine-geo').innerHTML = `📍 Denominazione: <b>${w.zona || 'N/D'}</b> &bull; Regione: <b>${w.regione || 'N/D'}</b>`;
            
            const isMescitaView = currentView === 'mescita';
            document.getElementById('modal-price-label').innerText = isMescitaView ? 'Prezzo Calice' : 'Prezzo Bottiglia';
            const activePrice = isMescitaView ? w.prezzoBicchiere : w.prezzo;
            document.getElementById('modal-wine-price').innerText = `${activePrice ? activePrice.toFixed(2) : '0.00'} €`;
            
            const descBox = document.getElementById('modal-desc-box');
            if (w.descrizione && w.descrizione.length > 0) {
                document.getElementById('modal-wine-desc').innerText = w.descrizione;
                descBox.classList.remove('hidden');
            } else {
                descBox.classList.add('hidden');
            }
            
            document.getElementById('wine-modal').classList.replace('hidden', 'flex');
        }

        function closeModal() { document.getElementById('wine-modal').classList.replace('flex', 'hidden'); }

        function renderWines() {
            const container = document.getElementById('wine-list');
            container.innerHTML = '';

            let filtered = wines.map((w, index) => ({...w, originalIndex: index})).filter(w => {
                if (!w.disponibile) return false;
                if (currentView === 'mescita' && w.prezzoBicchiere <= 0) return false;

                let matchesFilter = false;
                const activeFilterLower = currentFilter.toLowerCase().trim();
                const wineTipoLower = w.tipo ? w.tipo.toLowerCase().trim() : '';
                
                if (activeFilterLower === 'tutti') { 
                    matchesFilter = true; 
                } else if (activeFilterLower === 'champagne') {
                    matchesFilter = w.champagne === true || wineTipoLower === 'champagne';
                } else { 
                    matchesFilter = wineTipoLower === activeFilterLower; 
                }
                
                let targetPrice = currentView === 'mescita' ? w.prezzoBicchiere : w.prezzo;
                let matchesPrice = true;
                if (currentPriceFilter === 'ECONOMY') matchesPrice = targetPrice <= 30;
                if (currentPriceFilter === 'BUSINESS') matchesPrice = targetPrice >= 31 && targetPrice <= 50;
                if (currentPriceFilter === 'POWER') matchesPrice = targetPrice > 50;

                let matchesSearch = true;
                if (searchQuery) {
                    const fullText = `${w.cantina} ${w.nome} ${w.uve} ${w.regione} ${w.zona} ${w.doc} ${w.anno}`.toLowerCase();
                    matchesSearch = fullText.includes(searchQuery);
                }

                return matchesFilter && matchesPrice && matchesSearch;
            });

            if (currentView === 'mescita') {
                const orderMap = {
                    'franciacorta': 1, 'altre bolle': 2, 'champagne': 3,
                    'bianco': 4, 'rosso': 5, 'rosa': 6, 'arancione': 7
                };
                filtered.sort((a, b) => {
                    const typeA = a.tipo ? a.tipo.toLowerCase().trim() : '';
                    const typeB = b.tipo ? b.tipo.toLowerCase().trim() : '';
                    return (orderMap[typeA] || 99) - (orderMap[typeB] || 99);
                });
            }

            if(filtered.length === 0) {
                const emptyMsg = currentView === 'mescita' 
                    ? "Nessun vino in mescita rispecchia i filtri selezionati." 
                    : "Nessun vino rispecchia i filtri selezionati.";
                container.innerHTML = `<p class="col-span-full text-center text-[#d1d5db] py-12 italic font-bold text-sm">${emptyMsg}</p>`;
                return;
            }

            filtered.forEach(w => {
                let badgeLabel = w.sottotipo || 'Vino';
                let badgeColor = 'bg-stone-200 text-black';
                const tipoCheck = w.sottotipo ? w.sottotipo.toLowerCase().trim() : '';

                if (tipoCheck === 'rosso') badgeColor = 'bg-black text-white';
                else if (tipoCheck === 'bianco') badgeColor = 'bg-stone-200 text-black';
                else if (tipoCheck === 'franciacorta') badgeColor = 'bg-amber-300 text-black font-bold';
                else if (tipoCheck === 'altre bolle') badgeColor = 'bg-stone-300 text-black';
                else if (tipoCheck === 'arancione') badgeColor = 'bg-orange-300 text-black';
                else if (tipoCheck === 'rosa') badgeColor = 'bg-pink-200 text-black';

                const docBadge = w.doc ? `<span class="text-[10px] font-mono font-bold tracking-wider bg-white text-black px-1.5 py-0.5 rounded-none border border-black ml-2 uppercase">${w.doc}</span>` : '';
                const geoString = w.zona ? `${w.zona} &bull; ${w.regione}` : w.regione;
                const displayPrice = currentView === 'mescita' ? w.prezzoBicchiere : w.prezzo;
                const priceLabelSuffix = currentView === 'mescita' ? ' € <span class="text-[11px] font-medium text-stone-600">calice</span>' : ' €';

                container.innerHTML += `
                    <div onclick="openModal(${w.originalIndex})" class="bg-white p-5 ink-border flex flex-col justify-between transition duration-200 cursor-pointer hover:translate-x-0.5 hover:translate-y-0.5 hover:shadow-[1px_1px_0px_#111] active:translate-x-1 active:translate-y-1 active:shadow-none">
                        <div>
                            <div class="flex justify-between items-start gap-2">
                                <span class="text-[10px] font-bold px-2 py-0.5 uppercase tracking-wider border border-black ${badgeColor}">${badgeLabel}</span>
                                <span class="text-black font-bold font-mono">${displayPrice ? displayPrice.toFixed(2) : '0.00'}${priceLabelSuffix}</span>
                            </div>
                            
                            <h3 class="font-parbleu-title text-2xl text-black mt-3 font-medium leading-tight">
                                ${w.cantina}
                            </h3>
                            
                            <p class="text-stone-900 text-base mt-0.5 font-bold flex items-center flex-wrap">
                                ${w.nome} 
                                <span class="text-xs font-mono text-stone-600 ml-2 font-normal">${w.anno || ''}</span>
                                ${docBadge}
                            </p>
                            
                            <p class="text-stone-700 text-xs mt-1.5 font-medium flex items-center gap-1">
                                🍇 Uve: <span class="font-semibold text-black">${w.uve || 'N/D'}</span>
                            </p>
                            
                            <p class="text-stone-600 text-xs mt-2 flex items-center gap-1 font-medium">📍 ${geoString}</p>
                        </div>
                    </div>
                `;
            });
        }

        loadDataViaJSONP();
    </script>
</body>
</html>
